[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reciprocal"
readme = "README.md"
version = "1.0.0"
description = "utility functions for sampling reciprocal space"
authors = [
    { name = "Phillip Manley", email = "phillip.manley@jcmwave.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23,<3",
    "scipy>=1.10,<2",
    "shapely>=2,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",    
    "Operating System :: OS Independent"
]

[project.urls]
Repository = "https://github.com/jcmwave/reciprocal"

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4"]
test = [
    "matplotlib>=3.7,<4",
    "pytest>=7.4,<9",
]
dev = [
    "build>=1.2,<2",
    "flake8>=7,<8",
    "matplotlib>=3.7,<4",
    "mypy>=1.11,<2",
    "pytest>=7.4,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["reciprocal*"]

[tool.setuptools.package-data]
reciprocal = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["examples/typecheck_client.py"]
