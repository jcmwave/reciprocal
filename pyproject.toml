[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reciprocal"
readme = "README.md"
version = "1.0.0"
description = "utility functions for sampling reciprocal space"
authors = [
    { name = "Phillip Manley", email = "phillip.manley@jcmwave.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23,<3",
    "scipy>=1.10,<2",
    "shapely>=2,<3",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",    
    "Operating System :: OS Independent"
]

[project.urls]
Repository = "https://github.com/jcmwave/reciprocal"

[project.optional-dependencies]
plot = ["matplotlib>=3.7,<4"]
test = [
    "hypothesis>=6.100,<7",
    "matplotlib>=3.7,<4",
    "pytest>=7.4,<9",
]
dev = [
    "build>=1.2,<2",
    "hypothesis>=6.100,<7",
    "matplotlib>=3.7,<4",
    "mypy>=1.11,<2",
    "pre-commit>=3.7,<5",
    "pytest>=7.4,<9",
    "ruff>=0.6,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["reciprocal*"]

[tool.setuptools.package-data]
reciprocal = ["py.typed", "*.pyi"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["examples/typecheck_client.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The pre-1.0 implementation modules are migrated as they are touched. New
# modules, public entry points, examples, and P2 tests receive the full rules.
"src/reciprocal/{canvas,kspace,kvector,lattice,primitive,symmetry,unit_cell,utils}.py" = ["E401", "E402", "E701", "E702", "E703", "E711", "E712", "F401", "F841", "I001"]
"tests/test_figure_generation.py" = ["E401", "E402", "E701", "E702", "E711", "E712", "F401", "F841", "I001"]
"tests/{sampler_development,test_kspace,test_kvector,test_lattice,test_metadata,test_regressions,test_symmetry}.py" = ["F401", "F841", "I001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
