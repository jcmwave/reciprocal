repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff lint and import sorting
        entry: python -m ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: python -m ruff format
        language: system
        types: [python]
        exclude: ^src/reciprocal/(canvas|kspace|kvector|lattice|primitive|symmetry|unit_cell|utils)\.py$|^tests/test_figure_generation\.py$
      - id: mypy
        name: public API type check
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: unit tests
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
