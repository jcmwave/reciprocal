name: CI

on:
  push:
  pull_request:

jobs:
  test-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel and test dependencies
        run: |
          python -m pip install "$(find dist -name '*.whl')" pytest matplotlib flake8
      - name: Verify installed metadata outside the source tree
        run: |
          cd "$(mktemp -d)"
          python -c "import importlib.metadata as m, reciprocal; assert reciprocal.__version__ == m.version('reciprocal')"
      - name: Run tests against the installed wheel
        env:
          MPLBACKEND: Agg
        run: python -m pytest
      - name: Run static syntax checks
        run: |
          python -m compileall -q src tests
          python -m flake8 src/reciprocal --select=F821

  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python -m pip install "$(find dist -name '*.whl')"
      - name: Import core without plotting dependencies
        run: |
          cd "$(mktemp -d)"
          python -c "import reciprocal; from reciprocal.kspace import KSpace"
