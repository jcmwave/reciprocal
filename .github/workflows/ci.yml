name: CI

on:
  push:
  pull_request:

jobs:
  test-wheel:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel and test dependencies
        run: |
          python -m pip install "$(find dist -name '*.whl')[test]" mypy ruff
      - name: Verify installed metadata outside the source tree
        run: |
          cd "$(mktemp -d)"
          python -c "import importlib.metadata as m, reciprocal; assert reciprocal.__version__ == m.version('reciprocal')"
      - name: Run tests against the installed wheel
        env:
          MPLBACKEND: Agg
        run: python -m pytest
      - name: Run static syntax checks
        run: |
          python -m compileall -q src tests examples
          python -m ruff check .
          python -m ruff format --check src/reciprocal/__init__.py src/reciprocal/numerics.py examples tests/conftest.py tests/test_numerics.py tests/test_properties.py tests/test_public_api.py
          python -m mypy

  minimal-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel
      - run: python -m pip install "$(find dist -name '*.whl')"
      - name: Import core without plotting dependencies
        run: |
          cd "$(mktemp -d)"
          python -c "import reciprocal; from reciprocal.kspace import KSpace"

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: python -m pip install -e ".[docs]"
      - name: Build documentation
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
